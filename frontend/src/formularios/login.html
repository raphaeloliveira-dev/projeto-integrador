<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RecycleWear</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <header>
        <h1>RecycleWear</h1>

        <nav>
            <a href="../pages/index.html">Início</a>
        </nav>
    </header>

    <main class="container-cadastro">
        <div class="formulario">
            <h2>Bem-vindo de volta</h2>
            <p class="subtitulo">Acesse sua conta e continue sua jornada sustentável.</p>

            <form id="formLogin">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit">Entrar</button>
                <p id="mensagem"></p>
            </form>

            <p class="link-login">
                Ainda não tem uma conta?
                <a href="cadastro.html">Crie agora</a>
            </p>
        </div>
    </main>

    <footer>
        <p>RecycleWear © 2026 - Moda sustentável.</p>
    </footer>

    <script src="login.js"></script>
</body>
</html>
