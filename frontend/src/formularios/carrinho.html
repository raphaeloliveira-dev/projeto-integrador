<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu carrinho | RecycleWear</title>
    <link rel="stylesheet" href="carrinho.css">
</head>


<body>
    <header class="cabecalho-pagina">
        <a class="marca" href="../pages/index.html">RECYCLE<span>WEAR</span></a>
        <a class="link-voltar" href="../pages/index.html#produtos">← Continuar comprando</a>
    </header>

    <main class="conteudo-carrinho">
        <div class="titulo-carrinho">
            <p class="etiqueta-carrinho">RECYCLEWEAR / SACOLA</p>
            <h1 id="tituloCarrinho">Sua sacola <span id="quantidadeItens">0 itens</span></h1>
        </div>
        <section id="itensCarrinho" class="itens-carrinho" aria-label="Produtos na sacola" aria-live="polite"></section>

        <section class="calculadora-frete" aria-labelledby="tituloFrete">
            <div>
                <h2 id="tituloFrete">Calcule o frete</h2>
                <p>Taxa fixa demonstrativa de R$ 15,90 por pedido.</p>
            </div>
            <form id="formularioFrete" class="formulario-frete" novalidate>
                <label class="visually-hidden" for="cepFrete">CEP de entrega</label>
                <input
                    id="cepFrete"
                    name="cep"
                    type="text"
                    inputmode="numeric"
                    autocomplete="postal-code"
                    placeholder="00000-000"
                    maxlength="9"
                    aria-describedby="mensagemFrete"
                    required
                >
                <button type="submit">Calcular</button>
            </form>
            <div class="endereco-entrega">
                <label for="enderecoEntrega">Endereço de entrega</label>
                <textarea
                    id="enderecoEntrega"
                    name="endereco"
                    rows="3"
                    maxlength="300"
                    placeholder="Rua, número, bairro, cidade - UF"
                    autocomplete="street-address"
                    aria-describedby="ajudaEndereco"
                    required
                ></textarea>
                <p id="ajudaEndereco">Informe rua, número, bairro, cidade e estado.</p>
            </div>
            <p id="mensagemFrete" class="mensagem-frete" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer class="barra-resumo">
        <div class="nota-resumo">
            <p>Peças conscientes, escolhidas por você.</p>
            <button id="limparCarrinho" class="botao-limpar" type="button">Limpar sacola</button>
        </div>
        <div class="total-resumo">
            <div class="valores-resumo">
                <p><span>Subtotal</span><strong id="subtotalCarrinho">R$ 0,00</strong></p>
                <p><span>Frete</span><strong id="freteCarrinho">Calcule seu frete</strong></p>
                <p class="valor-total"><span>Total</span><strong id="totalCarrinho">R$ 0,00</strong></p>
            </div>
            <button id="finalizarCompra" class="botao-finalizar" type="button">Continuar para compra <span>→</span></button>
        </div>
    </footer>


    <script src="carrinho.js"></script>
</body>


</html>
