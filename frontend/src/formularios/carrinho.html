<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu carrinho | RecycleWear</title>
    <link rel="stylesheet" href="carrinho.css">
</head>


<body>
    <header class="cabecalho-pagina">
        <a class="marca" href="../pages/index.html">RECYCLE<span>WEAR</span></a>
        <a class="link-voltar" href="../pages/index.html#produtos">← Continuar comprando</a>
    </header>

    <main class="conteudo-carrinho">
        <div class="titulo-carrinho">
            <p class="etiqueta-carrinho">RECYCLEWEAR / SACOLA</p>
            <h1 id="tituloCarrinho">Sua sacola <span id="quantidadeItens">0 itens</span></h1>
        </div>
        <section id="itensCarrinho" class="itens-carrinho" aria-label="Produtos na sacola" aria-live="polite"></section>
    </main>

    <footer class="barra-resumo">
        <div class="nota-resumo">
            <p>Peças conscientes, escolhidas por você.</p>
            <button id="limparCarrinho" class="botao-limpar" type="button">Limpar sacola</button>
        </div>
        <div class="total-resumo">
            <p><span>Total</span><strong id="totalCarrinho">R$ 0,00</strong></p>
            <button id="finalizarCompra" class="botao-finalizar" type="button">Continuar para compra <span>→</span></button>
        </div>
    </footer>


    <script src="carrinho.js"></script>
</body>


</html>
